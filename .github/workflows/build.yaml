name: Build Cloud Controller RG40XXV Port

on:
  push:
    branches: [ main, master ]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Multiarch and Jammy Ports Repositories
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          # 1. Set base amd64 sources for Jammy (22.04)
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy main universe restricted multiverse" > /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy-updates main universe restricted multiverse" >> /etc/apt/sources.list
          echo "deb http://security.ubuntu.com/ubuntu/ jammy-security main universe restricted multiverse" >> /etc/apt/sources.list

          # 2. Enable arm64 architecture support
          dpkg --add-architecture arm64

          # 3. Direct arm64 requests to official Ubuntu ports mirror
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe restricted multiverse" > /etc/apt/sources.list.d/armports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe restricted multiverse" >> /etc/apt/sources.list.d/armports.list

          # 4. Update and install cross-compilation toolchain & dependencies cleanly
          apt-get update
          apt-get install -y \
            software-properties-common \
            wget \
            git \
            cmake \
            make \
            g++-aarch64-linux-gnu \
            libasound2-dev:arm64 \
            libsdl2-dev:arm64 \
            libsdl2-ttf-dev:arm64

      - name: Configure CMake for Cross-Compilation
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY

      - name: Build Executable
        run: cmake --build build -j4

      - name: Package Knulli Port Artifact
        run: |
          mkdir -p dist/cloud_controller
          cp build/cloud_controller dist/cloud_controller/
          if [ -d "package" ]; then cp -r package/* dist/cloud_controller/; fi
          cd dist && zip -r cloud_controller_knulli_port.zip cloud_controller

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-controller-rg40xxv-port
          path: dist/cloud_controller_knulli_port.zip